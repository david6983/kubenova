apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeboat-ui
  namespace: kubeboat
  labels:
    app: kubeboat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeboat-ui
  template:
    metadata:
      labels:
        app: kubeboat-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/YOUR_ORG/kubeboat-ui:latest
          ports:
            - containerPort: 80
          env:
            - name: SERVER_HOST
              value: kubeboat-server
            - name: SERVER_PORT
              value: "3001"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubeboat-ui
  namespace: kubeboat
spec:
  selector:
    app: kubeboat-ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
