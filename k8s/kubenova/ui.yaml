apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenova-ui
  namespace: kubenova
  labels:
    app: kubenova-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubenova-ui
  template:
    metadata:
      labels:
        app: kubenova-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/david6983/kubenova-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_HOST
              value: kubenova-server
            - name: SERVER_PORT
              value: "3001"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubenova-ui
  namespace: kubenova
spec:
  selector:
    app: kubenova-ui
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
