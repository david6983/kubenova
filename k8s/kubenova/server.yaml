apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubenova-server
  namespace: kubenova
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubenova-server
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubenova-server
subjects:
  - kind: ServiceAccount
    name: kubenova-server
    namespace: kubenova
roleRef:
  kind: ClusterRole
  name: kubenova-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenova-server
  namespace: kubenova
  labels:
    app: kubenova-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubenova-server
  template:
    metadata:
      labels:
        app: kubenova-server
    spec:
      serviceAccountName: kubenova-server
      containers:
        - name: server
          image: ghcr.io/david6983/kubenova-server:latest
          ports:
            - containerPort: 3001
          env:
            # Empty = use in-cluster service account auth (default).
            # Set to a kubeconfig context name for local / out-of-cluster use.
            - name: KUBENOVA_CONTEXT
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/cluster
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kubenova-server
  namespace: kubenova
spec:
  selector:
    app: kubenova-server
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
