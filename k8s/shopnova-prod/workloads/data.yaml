apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-main
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-main
  template:
    metadata:
      labels:
        app: postgres-main
    spec:
      containers:
        - name: postgres-main
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-main
  namespace: data
spec:
  selector:
    app: postgres-main
  ports:
    - port: 80
      targetPort: 80
---
