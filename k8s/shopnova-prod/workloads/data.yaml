---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-cleanup
  namespace: data
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-cleanup
              image: busybox:latest
              command: ["sh", "-c", "echo db-cleanup complete && sleep 5"]
