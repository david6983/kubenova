## KubeNova Helm values
## Override any of these in your own values file or with --set

image:
  registry: ghcr.io
  org: david6983
  tag: latest
  pullPolicy: IfNotPresent

## UI — nginx serving the React app
ui:
  replicaCount: 1
  image:
    name: kubenova-ui
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101      # nginx user
    readOnlyRootFilesystem: false  # nginx needs /tmp and /var/cache
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

## Server — Node.js backend (kubectl + eBPF proxy)
server:
  replicaCount: 1
  image:
    name: kubenova-server
  ## kubectl context — leave empty to use in-cluster service account (default)
  context: ""
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

## eBPF agent — DaemonSet, requires privileged
ebpfAgent:
  enabled: true
  image:
    name: kubenova-ebpf-agent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

## Ingress — expose the UI externally
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kubenova.example.com
  tls: []
  #  - secretName: kubenova-tls
  #    hosts:
  #      - kubenova.example.com
