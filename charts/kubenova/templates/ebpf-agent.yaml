{{- if .Values.ebpfAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubenova-ebpf-agent
  namespace: kube-system
  labels:
    app: kubenova-ebpf-agent
    {{- include "kubenova.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kubenova-ebpf-agent
  template:
    metadata:
      labels:
        app: kubenova-ebpf-agent
    spec:
      serviceAccountName: ebpf-agent
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: ebpf-agent
          image: {{ include "kubenova.image" (dict "root" . "name" .Values.ebpfAgent.image.name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 7777
          env:
            - name: LISTEN_ADDR
              value: ":7777"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, BPF]
          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
          resources:
            {{- toYaml .Values.ebpfAgent.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: proc
          hostPath:
            path: /proc
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
{{- end }}
