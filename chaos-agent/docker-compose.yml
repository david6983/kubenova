services:
  chaos-agent:
    build: .
    container_name: kubeboat-chaos
    ports:
      - "9666:9666"
    volumes:
      - "./kubeconfig.yaml:/root/.kube/config:ro"
    restart: unless-stopped
    environment:
      - KUBECONFIG=/root/.kube/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
