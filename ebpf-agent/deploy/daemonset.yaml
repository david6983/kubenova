apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-agent
subjects:
  - kind: ServiceAccount
    name: ebpf-agent
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ebpf-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-agent
  namespace: kube-system
  labels:
    app: ebpf-agent
spec:
  selector:
    matchLabels:
      app: ebpf-agent
  template:
    metadata:
      labels:
        app: ebpf-agent
      annotations:
        container.seccomp.security.alpha.kubernetes.io/ebpf-agent: unconfined
        io.containerd.runc.v2.seccomp: unconfined
    spec:
      serviceAccountName: ebpf-agent
      hostNetwork: true
      hostPID: true
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - operator: Exists
      containers:
        - name: ebpf-agent
          image: ebpf-agent:latest
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 7777
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":7777"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: false
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: proc
          hostPath:
            path: /proc
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
